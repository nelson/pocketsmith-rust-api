[package]
name = "pocketsmith-sync"
version = "0.1.0"
edition = "2021"

[features]
web = ["tiny_http", "maud"]

# Warnings are hard errors for this package's own code (lib, all bins, and
# tests). Scoped to this crate only — third-party dependencies are never
# affected — and honoured by `cargo build`/`cargo test`, so CI fails on any
# warning without needing RUSTFLAGS (which would also gate dependencies).
[lints.rust]
warnings = "deny"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
anyhow = "1"
dotenvy = "0.15"
regex = "1"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
tiny_http = { version = "0.12", optional = true }
maud = { version = "0.26", optional = true }

[[bin]]
name = "sync"
path = "src/main.rs"

[[bin]]
name = "transfers"
path = "src/bin/transfers.rs"

[[bin]]
name = "normalise"
path = "src/bin/normalise.rs"

[[bin]]
name = "serve"
path = "src/bin/serve/main.rs"
required-features = ["web"]

[[bin]]
name = "push"
path = "src/bin/push.rs"

[[bin]]
name = "dump"
path = "src/bin/dump.rs"

[[bin]]
name = "rule"
path = "src/bin/rule/main.rs"

