[package]
name = "pocketsmith"
version = "1.5.0"
edition = "2021"

[features]
web = ["tiny_http", "maud"]

# Warnings are hard errors for this package's own code (lib, all bins, and
# tests). Scoped to this crate only — third-party dependencies are never
# affected — and honoured by `cargo build`/`cargo test`, so CI fails on any
# warning without needing RUSTFLAGS (which would also gate dependencies).
[lints.rust]
warnings = "deny"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["backup", "bundled", "hooks"] }
anyhow = "1"
base64 = "0.22"
dotenvy = "0.15"
regex = "1"
ring = "0.17"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
tiny_http = { version = "0.12", optional = true }
maud = { version = "0.26", optional = true }

[[bin]]
name = "pocketsmith"
path = "src/main.rs"
