name: Sprites nightly pipeline

# sprites.dev VMs scale to zero (sleep when idle), so an in-VM systemd timer
# never fires. This scheduled job wakes the Sprite over SSH and runs the full
# pipeline. exe.dev / boxd deployments ignore this file (they use the in-VM
# timer in deploy/systemd/).
#
# To use: copy this file to .github/workflows/ on the branch you deploy from,
# and add repo secrets:
#   SPRITE_SSH_HOST  - the Sprite's SSH host (e.g. pocketsmith.sprites)
#   SPRITE_SSH_KEY   - a private key authorised on the Sprite

on:
  schedule:
    # 03:30 Australia/Sydney is 17:30 UTC (AEST, UTC+10). Adjust for DST.
    - cron: "30 17 * * *"
  workflow_dispatch: {}

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SPRITE_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.SPRITE_SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Wake Sprite and run pipeline
        run: |
          ssh -i ~/.ssh/id_ed25519 "${{ secrets.SPRITE_SSH_HOST }}" '
            set -e
            /usr/local/bin/sync
            # Daily run is sync-only for now. Re-enable the rest of the pipeline
            # when ready:
            # /usr/local/bin/transfers
            # /usr/local/bin/transfers --apply
            # /usr/local/bin/categorise
            # /usr/local/bin/push
          '
