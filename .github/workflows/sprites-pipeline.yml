name: Sprites sync pipeline

# Sprites scale to zero, so the schedule must run outside the VM. The database
# remains on the Sprite's persistent disk at /data/pocketsmith.db.

on:
  pull_request:
    paths:
      - ".github/workflows/sprites-pipeline.yml"
      - ".github/workflows/release.yml"
      - "deploy/deploy-sprites.sh"
  # A workflow-only change also exercises the repaired path immediately,
  # instead of waiting up to six hours for the next scheduled run.
  push:
    branches: [master]
    paths:
      - ".github/workflows/sprites-pipeline.yml"
  schedule:
    # Four refreshes per day. Using a six-hour UTC cadence avoids DST gaps and
    # leaves several recovery opportunities if GitHub drops or delays one run.
    - cron: "17 0,6,12,18 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: sprites-pocketsmith-sync
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SPRITE_NAME: ${{ vars.SPRITE_NAME || 'pocketsmith' }}
      # Keep the CLI and invocation syntax in lockstep. Update this pin
      # deliberately after reviewing Sprites release notes.
      SPRITE_CLI_VERSION: v0.0.1-rc48
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Sprite CLI
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/sprite-linux-amd64.tar.gz"
          checksum="$archive.sha256"
          bin_dir="$RUNNER_TEMP/sprite-bin"
          base_url="https://sprites-binaries.t3.storage.dev/client/$SPRITE_CLI_VERSION"

          mkdir -p "$bin_dir"
          curl -fsSL --retry 3 --retry-all-errors \
            "$base_url/sprite-linux-amd64.tar.gz" -o "$archive"
          curl -fsSL --retry 3 --retry-all-errors \
            "$base_url/sprite-linux-amd64.tar.gz.sha256" -o "$checksum"
          expected_sha256="$(awk 'NR == 1 { print $1 }' "$checksum")"
          echo "$expected_sha256  $archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          install -m 0755 "$RUNNER_TEMP/sprite" "$bin_dir/sprite"
          echo "$bin_dir" >> "$GITHUB_PATH"
          "$bin_dir/sprite" --help >/dev/null

      - name: Authenticate
        env:
          SPRITE_TOKEN: ${{ secrets.SPRITE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$SPRITE_TOKEN" ]; then
            echo "::error::SPRITE_TOKEN is not configured"
            exit 1
          fi
          sprite auth setup --token "$SPRITE_TOKEN"

      - name: Repair missing deployment
        env:
          GH_TOKEN: ${{ github.token }}
          VM: ${{ env.SPRITE_NAME }}
          PS_KEY: ${{ secrets.POCKETSMITH_API_KEY }}
          REPORTING_API_TOKEN: ${{ secrets.REPORTING_API_TOKEN }}
        run: |
          set -euo pipefail
          if sprite exec -s "$SPRITE_NAME" -- test -x /usr/local/bin/pocketsmith; then
            echo "PocketSmith is already installed"
            exit 0
          fi

          echo "PocketSmith is missing; restoring the latest release"
          bash deploy/deploy-sprites.sh

      - name: Wake Sprite and sync
        run: |
          set -euo pipefail
          succeeded=false

          for attempt in 1 2 3; do
            echo "Sync attempt $attempt of 3"
            # Current CLI syntax places the target flag on the exec command.
            # Run from /data so dotenv loads the persistent PocketSmith config.
            if sprite exec -s "$SPRITE_NAME" -- sudo -E \
              flock -w 120 /data/pocketsmith.writer.lock \
              bash -lc 'cd /data && /usr/local/bin/pocketsmith sync'; then
              succeeded=true
              break
            fi

            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 15))
            fi
          done

          if [ "$succeeded" != true ]; then
            echo "::error::PocketSmith sync failed after three attempts"
            exit 1
          fi

      - name: Validate persistent database
        run: |
          set -euo pipefail
          sprite exec -s "$SPRITE_NAME" -- sudo -E python3 - <<'PY'
          import sqlite3

          connection = sqlite3.connect(
              "file:/data/pocketsmith.db?mode=ro",
              uri=True,
              timeout=10,
          )
          try:
              integrity = connection.execute("PRAGMA quick_check").fetchone()[0]
              if integrity != "ok":
                  raise RuntimeError(f"SQLite quick_check failed: {integrity}")

              transaction_count = connection.execute(
                  "SELECT COUNT(*) FROM transactions"
              ).fetchone()[0]
              if transaction_count <= 0:
                  raise RuntimeError("persistent database contains no transactions")

              latest_sync = connection.execute(
                  """
                  SELECT created_at, transactions_updated
                  FROM _operations
                  WHERE reason = 'sync'
                  ORDER BY id DESC
                  LIMIT 1
                  """
              ).fetchone()
              if latest_sync is None:
                  raise RuntimeError("persistent database has no sync operation")

              print(
                  "database healthy; "
                  f"transactions={transaction_count}; "
                  f"latest_sync={latest_sync[0]}; "
                  f"updated={latest_sync[1]}"
              )
          finally:
              connection.close()
          PY

      - name: Create retained database snapshot
        run: |
          set -euo pipefail
          sprite exec -s "$SPRITE_NAME" -- sudo -E python3 - <<'PY'
          import datetime
          import json
          import os
          import pathlib
          import sqlite3

          source_path = pathlib.Path("/data/pocketsmith.db")
          snapshot_dir = pathlib.Path("/data/snapshots")
          snapshot_dir.mkdir(mode=0o700, parents=True, exist_ok=True)
          timestamp = datetime.datetime.now(datetime.timezone.utc).strftime(
              "%Y%m%dT%H%M%S%fZ"
          )
          final_path = snapshot_dir / f"pocketsmith-{timestamp}.db"
          temporary_path = snapshot_dir / f".{final_path.name}.tmp"

          source = sqlite3.connect(
              f"file:{source_path}?mode=ro", uri=True, timeout=10
          )
          destination = sqlite3.connect(temporary_path)
          try:
              source.backup(destination)
              check = destination.execute("PRAGMA quick_check").fetchone()[0]
              if check != "ok":
                  raise RuntimeError(f"snapshot quick_check failed: {check}")
          finally:
              destination.close()
              source.close()

          os.chmod(temporary_path, 0o600)
          os.replace(temporary_path, final_path)
          metadata = {
              "created_at": datetime.datetime.now(
                  datetime.timezone.utc
              ).isoformat(),
              "database": final_path.name,
              "source": str(source_path),
          }
          metadata_tmp = snapshot_dir / ".latest.json.tmp"
          metadata_tmp.write_text(json.dumps(metadata, indent=2) + "\n")
          os.replace(metadata_tmp, snapshot_dir / "latest.json")

          snapshots = sorted(snapshot_dir.glob("pocketsmith-*.db"))
          for expired in snapshots[:-28]:
              expired.unlink()
          print(f"created {final_path}; retained {min(len(snapshots), 28)} snapshots")
          PY
