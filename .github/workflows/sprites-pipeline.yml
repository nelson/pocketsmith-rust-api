name: Sprites nightly pipeline

# sprites.dev VMs scale to zero (sleep when idle), so an in-VM systemd timer
# never fires. This scheduled job wakes the sprite via the `sprite` CLI and
# runs the pipeline. exe.dev / boxd deployments ignore this file (they use the
# in-VM timer in deploy/systemd/).
#
# Required repo secret:
#   SPRITE_TOKEN - a sprite auth token in the form
#                  "<org>/<id>/<token-id>/<token-value>"
#                  (see `sprite auth setup --token`).
# Optional repo variable:
#   SPRITE_NAME  - sprite name (defaults to "pocketsmith").

on:
  schedule:
    # 03:30 Australia/Sydney is 17:30 UTC (AEST, UTC+10). Adjust for DST.
    - cron: "30 17 * * *"
  workflow_dispatch: {}

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    env:
      SPRITE_NAME: ${{ vars.SPRITE_NAME || 'pocketsmith' }}
    steps:
      - name: Install sprite CLI
        # Use the official installer from https://docs.sprites.dev. Verify the
        # exact install command/URL against the docs and pin if possible.
        run: curl -fsSL https://sprites.dev/install.sh | sh

      - name: Authenticate
        run: sprite auth setup --token "${{ secrets.SPRITE_TOKEN }}"

      - name: Wake sprite and run sync
        run: |
          # Daily run is sync-only for now. Re-enable the rest of the pipeline
          # when ready by adding more `sprite exec` lines (or a single chained
          # command).
          sprite -s "$SPRITE_NAME" exec -- /usr/local/bin/sync
          # sprite -s "$SPRITE_NAME" exec -- /usr/local/bin/transfers
          # sprite -s "$SPRITE_NAME" exec -- /usr/local/bin/transfers --apply
          # sprite -s "$SPRITE_NAME" exec -- /usr/local/bin/categorise
          # sprite -s "$SPRITE_NAME" exec -- /usr/local/bin/push
