name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    name: build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo + target
        uses: Swatinem/rust-cache@v2

      # Builds every target: the lib, all five default bins, and the
      # web-gated `serve` bin + all test harnesses. `web` is the only
      # non-default feature; it is the only one that adds compiled code.
      # Warnings fail the build: the `[lints.rust] warnings = "deny"` table
      # in Cargo.toml turns any warning in this package's code into an
      # error (dependencies are unaffected), so this step gates on them.
      - name: Build (all targets, web feature)
        run: cargo build --all-targets --features web --locked

      # `--features web` is additive, so this single run exercises the
      # default lib/bin tests plus the serve UI tests in one pass.
      - name: Test (web feature)
        run: cargo test --features web --locked

      - name: Reproduce blocking on the base implementation
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          git worktree add --detach "$RUNNER_TEMP/mcp-base" "$BASE_SHA"
          CARGO_TARGET_DIR="$RUNNER_TEMP/mcp-base-target" \
            cargo build --manifest-path "$RUNNER_TEMP/mcp-base/Cargo.toml" \
              --features web --locked --bin pocketsmith
          python3 deploy/verify-mcp-responsiveness.py \
            "$RUNNER_TEMP/mcp-base-target/debug/pocketsmith" --expect blocked

      - name: Verify patched server remains responsive
        run: python3 deploy/verify-mcp-responsiveness.py target/debug/pocketsmith --expect responsive

      - name: Validate deployment smoke script
        run: python3 -m py_compile deploy/verify-reporting-oauth.py deploy/verify-mcp-responsiveness.py
