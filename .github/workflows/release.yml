name: Release

# Auto-release on merge to master. release-please maintains a release PR from
# conventional-commit history; merging that PR tags + creates the GitHub
# Release, which triggers the static-binary build + asset upload below.
# (The existing ci.yml continues to build+test every push.)

on:
  push:
    branches: [master]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: rp
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build-binary:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (musl target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build static binary
        # Builds the single `pocketsmith` binary (with the web UI). Every former
        # command (sync, transfers, normalise, serve, push, dump, rule) is now a
        # subcommand of this one binary.
        run: |
          cargo build --release --features web --target x86_64-unknown-linux-musl --bins

      - name: Package tarball
        # Copy the single executable cargo produced plus the rules dir.
        run: |
          mkdir -p dist/rules
          cp -r rules/* dist/rules/
          find target/x86_64-unknown-linux-musl/release -maxdepth 1 -type f -executable \
            ! -name '*.d' -exec cp {} dist/ \;
          tar -C dist -czf pocketsmith-sync-x86_64-linux-musl.tar.gz .

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release-please.outputs.tag_name }}
          files: pocketsmith-sync-x86_64-linux-musl.tar.gz

  deploy-sprites:
    # Auto-deploy (upgrade) to the sprites.dev VM on every real release, after
    # the binary is attached. Keeps production on the latest release. Skips
    # cleanly if SPRITE_TOKEN isn't configured. First-time install is still
    # manual (needs PS_KEY): bash deploy/deploy-sprites.sh
    needs: [release-please, build-binary]
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to sprite (skips if SPRITE_TOKEN unset)
        env:
          SPRITE_TOKEN: ${{ secrets.SPRITE_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$SPRITE_TOKEN" ]; then
            echo "SPRITE_TOKEN not set; skipping auto-deploy."
            exit 0
          fi
          # Install the sprite CLI (verify the URL against docs.sprites.dev).
          curl -fsSL https://sprites.dev/install.sh | sh
          sprite auth setup --token "$SPRITE_TOKEN"
          bash deploy/deploy-sprites.sh
