name: Release

# Auto-release on merge to master. release-please maintains a release PR from
# conventional-commit history; merging that PR tags + creates the GitHub
# Release, which triggers the static-binary build + asset upload below.
# (The existing ci.yml continues to build+test every push.)

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
    types: [closed]
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.merged == true }}
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: rp
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build-binary:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (musl target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build static binary
        # Builds the single `pocketsmith` binary (with the web UI). Every former
        # command (sync, transfers, normalise, serve, push, dump, rule) is now a
        # subcommand of this one binary.
        run: |
          cargo build --release --features web --target x86_64-unknown-linux-musl --bins

      - name: Package tarball
        # Copy the single executable cargo produced plus the rules dir.
        run: |
          mkdir -p dist/rules
          cp -r rules/* dist/rules/
          find target/x86_64-unknown-linux-musl/release -maxdepth 1 -type f -executable \
            ! -name '*.d' -exec cp {} dist/ \;
          tar -C dist -czf pocketsmith-x86_64-linux-musl.tar.gz .

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release-please.outputs.tag_name }}
          files: pocketsmith-x86_64-linux-musl.tar.gz

  deploy-sprites:
    # Auto-deploy (upgrade) to the Sprite on every real release, after the
    # binary is attached. First-time install remains manual because it needs
    # PS_KEY; automated upgrades reuse /data/.env and /data/pocketsmith.db.
    needs: [release-please, build-binary]
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SPRITE_CLI_VERSION: v0.0.1-rc48
      REPORTING_BASE_URL: ${{ vars.REPORTING_BASE_URL || 'https://pocketsmith-busng.sprites.app' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Sprite CLI
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/sprite-linux-amd64.tar.gz"
          checksum="$archive.sha256"
          bin_dir="$RUNNER_TEMP/sprite-bin"
          base_url="https://sprites-binaries.t3.storage.dev/client/$SPRITE_CLI_VERSION"

          mkdir -p "$bin_dir"
          curl -fsSL --retry 3 --retry-all-errors \
            "$base_url/sprite-linux-amd64.tar.gz" -o "$archive"
          curl -fsSL --retry 3 --retry-all-errors \
            "$base_url/sprite-linux-amd64.tar.gz.sha256" -o "$checksum"
          expected_sha256="$(awk 'NR == 1 { print $1 }' "$checksum")"
          echo "$expected_sha256  $archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          install -m 0755 "$RUNNER_TEMP/sprite" "$bin_dir/sprite"
          echo "$bin_dir" >> "$GITHUB_PATH"
          "$bin_dir/sprite" --help >/dev/null

      - name: Deploy to Sprite
        env:
          SPRITE_TOKEN: ${{ secrets.SPRITE_TOKEN }}
          REPORTING_API_TOKEN: ${{ secrets.REPORTING_API_TOKEN }}
          REPORTING_OAUTH_PASSWORD: ${{ secrets.REPORTING_OAUTH_PASSWORD }}
          REPORTING_BASE_URL: ${{ env.REPORTING_BASE_URL }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VM: ${{ vars.SPRITE_NAME || 'pocketsmith' }}
        run: |
          set -euo pipefail
          if [ -z "$SPRITE_TOKEN" ]; then
            echo "SPRITE_TOKEN not set; skipping auto-deploy."
            exit 0
          fi
          sprite auth setup --token "$SPRITE_TOKEN"
          bash deploy/deploy-sprites.sh

      - name: Verify released MCP endpoint
        env:
          SPRITE_TOKEN: ${{ secrets.SPRITE_TOKEN }}
          REPORTING_API_TOKEN: ${{ secrets.REPORTING_API_TOKEN }}
          SPRITE_NAME: ${{ vars.SPRITE_NAME || 'pocketsmith' }}
        run: |
          set -euo pipefail
          if [ -z "$SPRITE_TOKEN" ] || [ -z "$REPORTING_API_TOKEN" ]; then
            echo "Sprite or reporting token is not configured; skipping MCP verification"
            exit 0
          fi

          sprite exec -s "$SPRITE_NAME" -- sudo -E bash -lc '
            set -euo pipefail
            set -a
            source /data/.env
            set +a

            initialized="$(curl -sS --retry 5 --retry-delay 2 \
              -o /tmp/released-mcp-initialize.json -w "%{http_code}" \
              -H "Authorization: Bearer $REPORTING_API_TOKEN" \
              -H "Content-Type: application/json" \
              -H "Accept: application/json, text/event-stream" \
              --data "{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"initialize\",\"params\":{\"protocolVersion\":\"2025-06-18\",\"capabilities\":{},\"clientInfo\":{\"name\":\"release-smoke\",\"version\":\"1.0\"}}}" \
              http://127.0.0.1:8080/mcp)"
            called="$(curl -sS -o /tmp/released-mcp-status.json -w "%{http_code}" \
              -H "Authorization: Bearer $REPORTING_API_TOKEN" \
              -H "Content-Type: application/json" \
              -H "Accept: application/json, text/event-stream" \
              --data "{\"jsonrpc\":\"2.0\",\"id\":2,\"method\":\"tools/call\",\"params\":{\"name\":\"get_reporting_status\",\"arguments\":{}}}" \
              http://127.0.0.1:8080/mcp)"
            unauthenticated="$(curl -sS -o /dev/null -w "%{http_code}" \
              -H "Content-Type: application/json" \
              --data "{\"jsonrpc\":\"2.0\",\"id\":3,\"method\":\"initialize\",\"params\":{}}" \
              http://127.0.0.1:8080/mcp)"

            test "$initialized" = 200
            test "$called" = 200
            test "$unauthenticated" = 401
            python3 -c "import json; \
              initialized=json.load(open(\"/tmp/released-mcp-initialize.json\")); \
              called=json.load(open(\"/tmp/released-mcp-status.json\")); \
              assert initialized.get(\"result\", {}).get(\"protocolVersion\") == \"2025-06-18\"; \
              assert called.get(\"result\", {}).get(\"structuredContent\", {}).get(\"status\") == \"ok\""
            rm -f /tmp/released-mcp-{initialize,status}.json
          '
          echo "Released MCP endpoint verified"

      - name: Verify released OAuth flow
        env:
          SPRITE_TOKEN: ${{ secrets.SPRITE_TOKEN }}
          REPORTING_OAUTH_PASSWORD: ${{ secrets.REPORTING_OAUTH_PASSWORD }}
          SPRITE_NAME: ${{ vars.SPRITE_NAME || 'pocketsmith' }}
        run: |
          set -euo pipefail
          if [ -z "$SPRITE_TOKEN" ] || [ -z "$REPORTING_OAUTH_PASSWORD" ]; then
            echo "Sprite or OAuth password is not configured; skipping OAuth verification"
            exit 0
          fi
          sprite exec -s "$SPRITE_NAME" -- sudo -E bash -lc '
            set -a; source /data/.env; set +a
            REQUIRE_CALLBACK_FORM_ACTION=1 python3 -
          ' < deploy/verify-reporting-oauth.py
